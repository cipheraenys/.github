name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: target
    attributes:
      label: Repo / target
      placeholder: ts3-core freertos port (QEMU), or ts3-quecpython on BQ280
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected vs. actual, with logs if any.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit / version
